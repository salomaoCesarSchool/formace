server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/pdf,text/html,text/css,application/javascript

spring:
  application:
    name: formace-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/formace}
    username: ${DB_USER:formace}
    password: ${DB_PASSWORD:formace}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: America/Araguaina

  jpa.defer-datasource-initialization: true

  # Envio de e-mail (recuperacao de senha) — credenciais por variavel de ambiente
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        # starttls:
           # enable: true
           # required: true

  sql:
    init:
      mode: always
      encoding: UTF-8
      continue-on-error: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:FORMACE-JWT-SECRET-KEY-2026-DESENVOLVIMENTO-SEGREDO-MANUEL-CRUZ}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*}
  frontend:
    # base do link de recuperacao de senha enviado por e-mail
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  fundacao:
    nome: Fundacao Manuel Cruz
    cnpj: "32.104.587/0001-90"
    orgao: Ministerio Publico de Sergipe (MP-SE)

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # SMTP sem credenciais nao pode derrubar o health check (Render usa /actuator/health)
      enabled: false

logging:
  level:
    root: INFO
    org.formace: DEBUG
    org.springframework.security: INFO
