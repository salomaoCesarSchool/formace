services:
  postgres:
    image: postgres:16-alpine
    container_name: formace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: formace
      POSTGRES_USER: formace
      POSTGRES_PASSWORD: formace
    ports:
      - "5432:5432"
    volumes:
      - formace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formace -d formace"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: formace-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/formace
      DB_USER: formace
      DB_PASSWORD: formace
      JWT_SECRET: ${JWT_SECRET:-FORMACE-JWT-SECRET-KEY-2026-DESENVOLVIMENTO-SEGREDO-MANUEL-CRUZ}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: formace-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

volumes:
  formace_pgdata:
